# Include inside the news.ljhboard.cn HTTPS server block managed by your panel.
location /stats/ {
    proxy_pass https://analytics.ljhboard.cn/;
    proxy_ssl_server_name on;
    proxy_ssl_name analytics.ljhboard.cn;
    proxy_set_header Host analytics.ljhboard.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://127.0.0.1:18104;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
}
