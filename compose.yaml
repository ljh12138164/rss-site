name: rss-site
services:
  web:
    image: rss-site-web:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: never
    restart: unless-stopped
    env_file: runtime.env
    ports:
      - "127.0.0.1:18104:3000"
    volumes:
      - mtran-data:/app/data/mtran
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mtran-data:
