name: rss-site
services:
  web:
    image: rss-site-web:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: never
    restart: unless-stopped
    env_file: runtime.env
    environment:
      REDIS_URL: redis://redis:6379
    networks:
      - default
      - database
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18104:3000"
    volumes:
      - mtran-data:/app/data/mtran
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: rss-site-postgres:18-cron-v1
    pull_policy: never
    restart: unless-stopped
    env_file: postgres.env
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "shared_preload_libraries=pg_cron,pg_net", "-c", "cron.database_name=rss_site", "-c", "pg_net.database_name=rss_site", "-c", "cron.timezone=UTC", "-c", "cron.use_background_workers=on", "-c", "cron.max_running_jobs=3"]
    networks:
      - database
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mtran-data:
  redis-data:
  postgres-data:
    external: true
    name: rss-site-postgres18-data

networks:
  database:
    internal: true
