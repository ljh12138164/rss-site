name: Verify and deploy news
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_only:
        description: Build an image artifact without verification or deployment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: rss_site
          POSTGRES_PASSWORD: ci-admin-only
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d rss_site" --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
      DAILY_REPORT_TEST_DATABASE_URL: postgres://postgres:ci-admin-only@127.0.0.1:5432/rss_site
      SITE_URL: https://news.ljhboard.cn
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
      - name: Initialize isolated PostgreSQL 18 test schema
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d rss_site -v ON_ERROR_STOP=1 < deploy/postgres/baseline.sql
      - run: pnpm test
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
      - run: pnpm check-types
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
      - name: Check deployment shell scripts
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        run: |
          python3 deploy/server/test-release-packaging.py
          python3 -m pip install cryptography==49.0.0
          python3 -B deploy/server/test-postgres-backup.py
          python3 -B deploy/server/test-business-timers.py
          bash -n deploy/server/verify-release-runtime
          bash -n deploy/server/deploy-rss-site
          sh -n deploy/server/rss-site-deploy-gate
          bash -n deploy/server/bootstrap-rss-site
          shellcheck deploy/server/deploy-rss-site deploy/server/rss-site-deploy-gate deploy/server/bootstrap-rss-site deploy/server/verify-release-runtime
      - name: Build release image
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          docker build --tag "rss-site-web:sha-${GITHUB_SHA}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY .
      - name: Verify runtime with PostgreSQL 18 and the application role
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        run: bash deploy/server/verify-release-runtime "rss-site-web:sha-${GITHUB_SHA}"
      - name: Package migration image
        if: github.event_name == 'workflow_dispatch' && inputs.build_only
        run: docker save "rss-site-web:sha-${GITHUB_SHA}" | gzip -1 > migration-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_only
        with:
          name: migration-image-linux
          path: migration-image.tar.gz
          compression-level: 0
          retention-days: 1
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && !inputs.build_only
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: news-production
      cancel-in-progress: false
    env:
      SITE_URL: https://news.ljhboard.cn
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release image
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          docker build --tag "rss-site-web:sha-${GITHUB_SHA}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY .
      - name: Verify release image with PostgreSQL 18
        run: bash deploy/server/verify-release-runtime "rss-site-web:sha-${GITHUB_SHA}"
      - name: Package release image
        run: |
          docker pull redis:7.4-alpine
          docker pull postgres:18-alpine
          docker save "rss-site-web:sha-${GITHUB_SHA}" redis:7.4-alpine postgres:18-alpine -o image.tar
          tar -czf release.tar.gz image.tar compose.yaml \
            deploy/server/deploy-rss-site deploy/server/rss-site-deploy-gate deploy/server/rss-site-deploy.sudoers
      - name: Install SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy verified bundle
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'rss-site-deploy' }}
        run: |
          test -n "$DEPLOY_HOST"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy sha-${GITHUB_SHA}" < release.tar.gz
      - name: Verify public site
        run: curl --fail --retry 5 --retry-delay 3 --max-time 15 https://news.ljhboard.cn/healthz
