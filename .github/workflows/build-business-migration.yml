name: Build business database migration image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: |
          docker build --tag "rss-site-web:sha-${GITHUB_SHA}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY .
          docker save "rss-site-web:sha-${GITHUB_SHA}" | gzip -1 > migration-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: migration-image-linux
          path: migration-image.tar.gz
          compression-level: 0
          retention-days: 1
